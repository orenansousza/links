<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renan Sousa — Links</title>
<meta name="description" content="Renan Sousa — Vídeo, fotografia e design. Portfólio, Behance e orçamento pelo WhatsApp.">
<meta property="og:title" content="Renan Sousa — Links">
<meta property="og:description" content="Vídeo, fotografia e design para marcas que querem ser notadas.">
<meta property="og:image" content="https://i.postimg.cc/bwCSYb6K/perfil-renan.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#eef4ff;--ink:#000;--mut:#4b5568;--line:#d6e2fb;--b:#087BFF;--r:#0033CC;--disp:"Bricolage Grotesque","Arial Black",Arial,sans-serif;--sans:"Manrope",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(ellipse 80% 50% at 50% 0,rgba(8,123,255,.16),transparent 65%),linear-gradient(180deg,var(--soft) 0,#fff 420px)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--b);outline-offset:3px}

.page{max-width:520px;margin:0 auto;padding:56px 20px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;text-align:center}

.bu{opacity:0;transform:translateY(24px);filter:blur(10px);animation:up 1s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes up{to{opacity:1;transform:none;filter:none}}

.tag{display:inline-block;border:1.5px solid var(--b);color:var(--r);border-radius:8px;padding:5px 14px;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px}

.photo{position:relative;width:112px;height:112px;margin-bottom:22px}
.photo:before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,var(--b),var(--r),#6fb1ff,var(--b));animation:spin 8s linear infinite}
.photo .in{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--soft);border:4px solid #fff;display:grid;place-items:center;font:800 32px var(--disp);color:var(--r);letter-spacing:-.04em}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font:800 clamp(42px,12vw,60px)/.95 var(--disp);letter-spacing:-.05em}
h1 span{background:linear-gradient(90deg,var(--b),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:4px}
.sub{margin-top:14px;color:var(--mut);font-size:17px;max-width:21em}
.handles{display:inline-flex;flex-wrap:wrap;justify-content:center;border:1.5px solid var(--r);border-radius:10px;margin-top:20px;font-size:14px;font-weight:600;color:var(--r);background:#fff}
.handles span{padding:5px 15px}.handles span+span{border-left:1.5px solid var(--r)}

.links{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:38px}

.cta{display:flex;align-items:center;gap:14px;border-radius:18px;padding:10px 10px 10px 24px;background:linear-gradient(135deg,var(--b),var(--r));color:#fff;text-align:left;box-shadow:0 14px 34px rgba(8,123,255,.35),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .3s var(--ease),box-shadow .3s}
.cta .t{flex:1}
.cta b{display:block;font:700 18px/1.2 var(--sans);letter-spacing:-.01em}
.cta small{display:block;font-size:13.5px;color:#d3e4ff;margin-top:2px}
.cta i{font-style:normal;display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#fff;color:var(--r);font-size:20px;transition:transform .35s var(--ease)}
.cta:hover{transform:scale(1.025);box-shadow:0 18px 44px rgba(0,51,204,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.cta:hover i{transform:translateX(3px)}

.tile{display:flex;align-items:center;gap:16px;padding:16px 18px;text-align:left;background:var(--soft);border:1.5px solid var(--line);border-radius:20px;transition:transform .4s var(--ease),border-color .3s,box-shadow .3s}
.tile:hover{transform:translateY(-4px);border-color:var(--b);box-shadow:0 14px 30px rgba(0,51,204,.14)}
.ic{width:48px;height:48px;border-radius:14px;background:var(--b);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:background .3s}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile .t{flex:1;min-width:0}
.tile b{display:block;font:700 20px/1.1 var(--disp);letter-spacing:-.03em}
.tile small{display:block;font-size:14px;color:var(--mut);margin-top:3px}
.tile .ar{color:var(--b);font-size:18px;transition:transform .35s var(--ease)}
.tile:hover .ar{transform:translateX(4px)}
.tile.k{background:#000;border-color:#000;color:#fff}
.tile.k small{color:#a9b6d3}
.tile.k .ic{background:var(--r)}
.tile.k:hover{border-color:var(--b)}
.tile.k .ar{color:#6fb1ff}

footer{margin-top:44px;color:#7d8aa8;font-size:13px}

@media(max-width:380px){.tile{padding:14px}.tile b{font-size:18px}.cta b{font-size:16px}}
@media(prefers-reduced-motion:reduce){.bu{animation:none;opacity:1;transform:none;filter:none}.photo:before{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <span class="tag bu">Renan Audiovisual</span>

  <div class="photo bu" style="--d:.05s">
    <div class="in">RS<img src="https://i.postimg.cc/bwCSYb6K/perfil-renan.png" alt="Renan Sousa" onerror="this.remove()"></div>
  </div>

  <h1 class="bu" style="--d:.12s">Renan <span>Sousa</span></h1>
  <div class="handles bu" style="--d:.26s"><span>Vídeo</span><span>Foto</span><span>Design</span></div>

  <nav class="links" aria-label="Links">
    <a class="cta bu" style="--d:.34s" href="https://api.whatsapp.com/send/?phone=5583982094055&text=Ol%C3%A1%21+Vi+seu+portf%C3%B3lio+e+gostaria+de+solicitar+um+or%C3%A7amento.&type=phone_number&app_absent=0" target="_blank" rel="noopener">
      <span class="t"><b>Peça seu orçamento</b><small>Fale comigo no WhatsApp</small></span><i>→</i>
    </a>

    <a class="tile k bu" style="--d:.42s" href="https://orenansousza.github.io/portfolio/" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3.5"/><path d="M10.5 9.5l4 2.5-4 2.5z"/></svg></span>
      <span class="t"><b>Ver portfólio completo</b><small>Vídeos, fotos e artes</small></span><span class="ar">→</span>
    </a>

    <a class="tile bu" style="--d:.5s" href="https://www.behance.net/RafaelRenanAmorim" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h6a3 3 0 0 1 0 6H4z"/><path d="M4 11h6.5a3.5 3.5 0 0 1 0 7H4z"/><path d="M14.5 8h6"/><path d="M14 13.5c0-2 1.5-3.5 3.5-3.5s3.4 1.5 3.4 3.6c0 .2 0 .3 0 .4h-6.7c0 1.6 1.2 2.6 2.9 2.6 1.1 0 1.9-.4 2.4-1.1"/></svg></span>
      <span class="t"><b>Behance</b><small>Galeria de projetos</small></span><span class="ar">→</span>
    </a>
  </nav>

  <footer class="bu" style="--d:.6s">© <span id="y"></span> Renan Sousa — Todos os direitos reservados</footer>
</main>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
